name: Deploy Notebook Online
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: notebook-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/pages.yml@v2
    with:
      path: '_site'
      stage-command: node scripts/stage.mjs
      verify-marker: notebook-fragment-kit-v0.4.3
