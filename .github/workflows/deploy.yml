name: Deploy Notebook Online
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: notebook-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v2
    with:
      node-version: '24'
      pre-test: python3 -m pip install -r tests/requirements.txt && npm run test:python && TEST_PACKAGES=1 npm test && npm run test:formats
      kit-path: vendor/fragment-kit-v0.4.3
      contract-config: testing-contract.config.mjs
      server-command: PORT=8000 node tests/browser/server.cjs
      browser-command: TEST_PACKAGES=1 FULL_GALLERY=1 npm run test:browser
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.4.3
  deploy:
    needs: [test, kit]
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/pages.yml@v2
    with:
      path: '_site'
      stage-command: node scripts/stage.mjs
      verify-marker: notebook-fragment-kit-v0.4.3
